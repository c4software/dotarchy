# Monitors
# Format: monitor = [port], resolution, position, scale
monitor = eDP-1, 2880x1920@60, auto, 1.67
monitor = , preferred, auto, 1
# Stock monitors.conf sets GDK_SCALE=2 for retina displays; override it back to 1
env = GDK_SCALE,1

# Input
input {
  kb_layout = bepoDev
  kb_options = lv3:caps_switch # ,grp:alts_toggle
}

# Enable touchpad gestures for changing workspaces (commented out in stock)
gesture = 3, horizontal, workspace
gesture = 3, vertical, fullscreen, 1

# Note: stock input.conf applies scroll_touchpad 1.5 to (Alacritty|kitty|foot);
# my version dropped foot from the regex, but that removal can't be expressed
# as an additive rule — the stock rule is kept as-is.

# Bindings — added
unbind = ALT, TAB
binde = ALT, TAB, exec, alttab
unbind = SUPER, TAB
binde = SUPER, TAB, exec, alttab
layerrule = no_anim on, match:namespace hypr-alttab

unbind = SUPER, code:61
unbind = SUPER ALT, code:61

bindd = ALT, up, Full width, exec, omarchy-expand-full-width
bindd = ALT, down, Full width, exec, omarchy-expand-full-width
windowrule = border_color rgb(FF0000) rgb(880808), match:fullscreen 1

binde = ALT SHIFT, right, resizeactive, 50 0
binde = ALT SHIFT, left, resizeactive, -50 0
binde = ALT SHIFT, up, resizeactive, 0 -50
binde = ALT SHIFT, down, resizeactive, 0 50

unbind = ALT SHIFT, code:13
bind = ALT SHIFT, code:13, exec, omarchy-menu capture
