# Status line buttons and the menu of the Herdr agents, sourced at the end of
# tmux.conf (after the theme: it replaces status-left and adds to
# status-right). The script is ~/.config/tmux/herdr.
#
# + (in place of the session name, in its colours) opens a new window in the
# directory of the current pane. agents (at the end on the right) shows the
# number of live herdr-core terminals, hides when there are none, and opens
# their menu: each line opens or closes the agent in a tmux window of its own.
# tmux runs `herdr count` again at each status-interval, so an agent started
# or ended from herdr-app shows up within seconds.

set -g status-left "#[range=user|newwin]#[fg=black,bg=blue,bold] + #[norange]#[bg=default] "
# No comma in the shown branch of the condition: it would end it early.
set -ga status-right "#{?#(~/.config/tmux/herdr count),#[range=user|herdr]#[fg=blue bold] agents #(~/.config/tmux/herdr count) #[norange default],}"

# prefix + a: the same menu
bind a run-shell "~/.config/tmux/herdr menu '#{client_name}'"

# The buttons act on the release of the click: the menu is drawn by run-shell,
# and a menu that is not opened by the mouse binding itself closes on that
# release. The press keeps the default action of tmux everywhere.
bind -n MouseUp1Status if -F '#{==:#{mouse_status_range},herdr}' {
  run-shell "~/.config/tmux/herdr menu '#{client_name}' mouse"
} {
  if -F '#{==:#{mouse_status_range},newwin}' {
    new-window -c "#{pane_current_path}"
  }
}
