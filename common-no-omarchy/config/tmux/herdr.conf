# Status line buttons and the agents of Herdr, sourced at the end of
# tmux.conf (after the theme: it replaces status-left and adds to
# status-right). The script is ~/.config/tmux/herdr.
#
# + (in place of the session name, in its colours) opens a new window in the
# directory of the current pane. The agents button (at the end on the right,
# after the name of the machine, in the colours of +) is always there when
# herdr-core is installed, with the number of live terminals when there are
# some, a red ⚠N beside it when agents need you. The button, or prefix + a,
# shows or hides the sidebar: the agents in a pane on the right of each
# window, the height of it, made when the window is shown. Its first line
# (or prefix + A from anywhere) starts a new agent, here or on a machine of
# herdr-core, in the folder of the current pane; herdr-app shows it too.
#
# tmux runs `herdr count` again at each status-interval (set in tmux.conf).

set -g status-left "#[range=user|newwin]#[fg=black,bg=blue,bold] + #[norange]#[bg=default] "
# No comma in the shown branches of the conditions: it would end them early.
set -ga status-right "#{?#(~/.config/tmux/herdr has),#[range=user|herdr]#[fg=black bg=blue bold] agents#{?#(~/.config/tmux/herdr count), #(~/.config/tmux/herdr count),} #{?@herdr_blocked,#[fg=black bg=red bold] ⚠#{@herdr_blocked} ,}#[norange default],}"
# Room for the machine name, the modes (PREFIX, ZOOM) and the button
set -g status-right-length 80

# A window that shows an agent waiting for you (blocked, a question): red,
# with ⚠ (herdr watch sets @herdr_blk). The rest is the format of tmux.conf.
set -g window-status-format "#{?@herdr_blk,#[fg=red bold] #I:#W ⚠ ,#[fg=brightblack] #I:#W }"
set -g window-status-current-format "#{?@herdr_blk,#[fg=black bg=red bold] #I:#W ⚠ ,#[fg=blue bold] #I:#W }"

# One watcher per tmux server (a lock makes the others end at once), it ends
# with the server. After an update of the script: herdr watch restart.
# It shows a desktop notification too when an agent is blocked or failed;
# also when it is done (each answer) with: set -g @herdr_notify_done 1
run-shell -b "~/.config/tmux/herdr watch '#{socket_path}'"

# prefix + a: the sidebar. prefix + A: straight to a new agent. prefix +
# Alt+a: the former tmux menu, the mouse can pick its lines too (see herdr
# prepare). The floating window (herdr popup) has no key any more.
# prefix + a: hidden, the sidebar shows with the focus; shown, it gets the
# focus; focused, it goes (the agents button only shows or hides it).
bind a run-shell "~/.config/tmux/herdr sidebar key '#{window_id}'"
bind A display-popup -E -w 90% -h 80% -d "#{pane_current_path}" -T "#[align=centre] New agent " "~/.config/tmux/herdr new"
bind M-a { run-shell "~/.config/tmux/herdr prepare" ; run-shell -C "#{@herdr_menu}" }

# Ctrl+K, without the prefix (like the quick open of VS Code): the palette, a
# search in the windows of every session and in the agents. Any terminal
# sends it as it is. prefix + Ctrl+K gives Ctrl+K to the program (the end of
# the line in the shell).
bind -n C-k display-popup -E -w 70% -h 60% -T "#[align=centre] Go to " "~/.config/tmux/herdr palette"
bind C-k send-keys C-k


# The window shown gets its sidebar (one per window, none moves), or a
# refresh of the one it has
set-hook -g 'session-window-changed[42]' 'run-shell -b "~/.config/tmux/herdr sidebar ensure \"#{window_id}\""'
set-hook -g 'client-session-changed[42]' 'run-shell -b "~/.config/tmux/herdr sidebar ensure \"#{window_id}\""'
set-hook -g 'after-new-window[42]' 'run-shell -b "~/.config/tmux/herdr sidebar ensure \"#{window_id}\""'
# A window with only its sidebar left closes, as it would without it, and
# tmux with its last window
# The sidebar is not split, whatever the key or the menu: a pane split from
# it goes beside the pane on its left, and the sidebar keeps its place.
set-hook -g 'after-split-window[42]' 'run-shell -b "~/.config/tmux/herdr sidebar unsplit \"#{window_id}\""'
# One width for every sidebar: yours when you resize one (a drag on its
# border), kept when a window changes size
set-hook -g 'after-resize-pane[42]' 'run-shell -b "~/.config/tmux/herdr sidebar resized \"#{window_id}\""'
set-hook -g 'window-resized[42]' 'run-shell -b "~/.config/tmux/herdr sidebar window-resized \"#{window_id}\""'
set-hook -g 'pane-exited[42]' 'run-shell -b "~/.config/tmux/herdr sidebar alone"'
set-hook -g 'after-kill-pane[42]' 'run-shell -b "~/.config/tmux/herdr sidebar alone"'

# The buttons act on the release of the click, the press keeps the default
# action of tmux everywhere.
bind -n MouseUp1Status if -F '#{==:#{mouse_status_range},herdr}' {
  run-shell "~/.config/tmux/herdr sidebar toggle '#{window_id}'"
} {
  if -F '#{==:#{mouse_status_range},newwin}' {
    new-window -c "#{pane_current_path}"
  }
}

# The options of the sidebar (its ⚙: a click on its header), kept by
# herdr in this file
source-file -q ~/.config/tmux/herdr-options.conf
